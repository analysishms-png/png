<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aysa Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#1A73E8"/>
          <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Inter" font-size="20" font-weight="600">A</text>
        </svg>
      </div>
      <h2>Welcome back!</h2>
      <p>Sign in to continue to Aysa</p>
      
      <form id="loginForm">
        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.5 16.5a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1 0-3h13a1.5 1.5 0 0 1 1.5 1.5zM21.5 4a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1 0-3h13a1.5 1.5 0 0 1 1.5 1.5z"/>
            <path fill-rule="evenodd" d="M1 8a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V8zm0 4a3 3 0 0 0 3 3h6a3 3 0 0 0 0-6H4a3 3 0 0 0-3 3v4z"/>
          </svg>
          <input type="email" id="email" required placeholder="Enter your email">
        </div>
        
        <div class="input-group">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.5 16.5a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1 0-3h13a1.5 1.5 0 0 1 1.5 1.5zM21.5 4a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1 0-3h13a1.5 1.5 0 0 1 1.5 1.5z"/>
            <path fill-rule="evenodd" d="M1 8a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V8zm0 4a3 3 0 0 0 3 3h6a3 3 0 0 0 0-6H4a3 3 0 0 0-3 3v4z"/>
          </svg>
          <input type="password" id="password" required placeholder="Enter your password">
        </div>
        
        <button type="submit" class="btn-login">Sign In</button>
        
        <p class="footer-links">
          <a href="#">Forgot password?</a> &bull; <a href="#">Create account</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
